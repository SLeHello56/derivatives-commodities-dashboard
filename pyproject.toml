[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "derivatives-dashboard"
version = "0.1.0"
description = "Options pricing and synthetic commodities term-structure dashboard"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.24",
   "pandas>=2.0",
   "plotly>=5.18",
   "streamlit>=1.30",
   "requests>=2.31"
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
